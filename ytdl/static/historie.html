<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historie · yt-album-dl</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="masthead">
    <img src="img/logo.webp" alt="" class="logo" width="88" height="88">
    <div class="masthead-text">
      <h1>Historie</h1>
      <p id="hist-count" class="muted small"></p>
    </div>
    <nav class="masthead-nav">
      <a href="/" class="nav-link">← Zurück zu den Downloads</a>
    </nav>
  </header>

  <form id="hist-filter" class="panel hist-filter">
    <label class="grow">Suche <input id="hist-q" type="search" placeholder="Interpret, Titel, Album, URL, Pfad …"></label>
    <label>Modus
      <select id="hist-mode"><option value="">alle</option><option value="musik">Musik</option><option value="podcast">Podcast / Audio</option></select>
    </label>
    <label>Ergebnis
      <select id="hist-result">
        <option value="">alle</option><option value="fertig">fertig</option><option value="überschrieben">überschrieben</option>
        <option value="übersprungen">übersprungen</option><option value="fehler">nur Fehler</option>
      </select>
    </label>
    <label>Zeitraum
      <select id="hist-days"><option value="">gesamt</option><option value="1">heute</option><option value="7">7 Tage</option><option value="30">30 Tage</option><option value="365">1 Jahr</option></select>
    </label>
    <div class="row hist-actions">
      <a id="hist-csv" class="nav-link" href="/api/history.csv" download>CSV exportieren</a>
      <button type="button" id="hist-clear" class="ghost">Historie leeren</button>
    </div>
  </form>

  <section class="downloads">
    <div id="hist-list"></div>
    <div class="row hist-more">
      <button type="button" id="hist-more" hidden>Mehr laden</button>
    </div>
  </section>
</main>
<script src="historie.js"></script>
</body>
</html>
