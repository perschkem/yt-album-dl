[project]
name = "yt-album-dl"
version = "0.1.0"
description = "YouTube → MP3 mit sauberer Sortierung, vollständigen Tags und automatischem Aufteilen von Album-Videos (Weboberfläche)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "yt-dlp>=2025.1.1",
    "mutagen>=1.47",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "numpy>=2.5.3",
    "rapidocr>=3.9.2",
    "onnxruntime>=1.30.0",
]

[project.scripts]
ytdl-web = "ytdl.web:main"

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
